# ============================================================================
# VEO SUITE V3 — pyproject.toml
# ============================================================================
# File này chỉ cấu hình *tooling* (ruff, pytest, pyright). Repo dùng layout
# script-style (sys.path += VeoSuite_V3/), không build wheel/installable.
# Nếu sau này muốn package ra wheel, đổi mục [project] và bật build-system.
# ============================================================================

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = [
    "VeoSuite_V3/output",
    "VeoSuite_V3/logs",
    "VeoSuite_V3/database/veo_suite.db",
    "scratch",
    "build",
    "dist",
    # Legacy untouched modules — sẽ bật lint khi refactor (PR-5b/5c/5d trở đi).
    # Hiện chứa ~4000 lint warnings (whitespace, multi-statement lines, bare except…)
    # Không nên block CI cho PR-5 vì scope chưa chạm đến chúng.
    "VeoSuite_V3/bac_si_veo.py",
    "VeoSuite_V3/setup_project.py",
    "VeoSuite_V3/tool_asset_factory.py",
    "VeoSuite_V3/ui/admin_tab.py",
    "VeoSuite_V3/ui/main_window.py",
    "VeoSuite_V3/ui/styles.py",
    "VeoSuite_V3/ui/widgets/content_tab.py",
    "VeoSuite_V3/ui/widgets/editor_tab.py",
    "VeoSuite_V3/ui/widgets/media_tab.py",
    "VeoSuite_V3/ui/widgets/publisher_tab.py",
    "VeoSuite_V3/ui/widgets/radar_tab.py",
    "VeoSuite_V3/modules/assets_factory/constants.py",
    "VeoSuite_V3/modules/assets_factory/prompt_templates.py",
    "VeoSuite_V3/modules/assets_factory/subtitle_engine.py",
    "VeoSuite_V3/modules/assets_factory/ui_components.py",
    "VeoSuite_V3/modules/content/ui_components.py",
    "VeoSuite_V3/modules/content/workers.py",
    "VeoSuite_V3/modules/assets_factory/workers.py",
    "VeoSuite_V3/modules/publisher/platforms/facebook_api.py",
    "VeoSuite_V3/modules/publisher/platforms/instagram_api.py",
    "VeoSuite_V3/modules/publisher/platforms/tiktok_api.py",
    "VeoSuite_V3/modules/radar",
    "VeoSuite_V3/modules/render",
    "VeoSuite_V3/services/ai_factory.py",
    "VeoSuite_V3/services/audio_service.py",
    "VeoSuite_V3/services/render_service.py",
    "VeoSuite_V3/services/thumbnail_composer.py",
    "VeoSuite_V3/services/video_assembler.py",
    "VeoSuite_V3/services/voice_constants.py",
]

[tool.ruff.lint]
# Bộ rule cân bằng: pyflakes + pycodestyle (E/W) + isort (I) + bugbear (B)
# + comprehensions (C4) + simplify (SIM) + unused-args (ARG).
# KHÔNG bật toàn bộ "ALL" để tránh ngập warnings ở giai đoạn dọn dẹp đầu tiên.
select = ["E", "F", "W", "I", "B", "C4", "SIM", "UP"]
ignore = [
    "E501",   # line-too-long: vài chỗ tiếng Việt không vỡ được dễ
    "B008",   # function call in default argument (PyQt signals/QObject patterns)
    "SIM108", # ternary if/else (đôi khi đọc khó hơn if/else)
    "UP015",  # open(..., 'r') — giữ rõ nghĩa
]

[tool.ruff.lint.per-file-ignores]
"VeoSuite_V3/main.py" = ["E402"]  # sys.path.insert phải chạy TRƯỚC import
"tests/*.py" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"  # giữ CRLF cho file hiện đang dùng CRLF

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["VeoSuite_V3"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.pyright]
include = ["VeoSuite_V3"]
exclude = [
    "VeoSuite_V3/output",
    "VeoSuite_V3/logs",
    "scratch",
]
pythonVersion = "3.11"
reportMissingImports = "warning"
reportGeneralTypeIssues = "warning"
typeCheckingMode = "basic"
