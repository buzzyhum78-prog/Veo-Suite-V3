# ============================================================================
# VEO SUITE V3 — pre-commit hooks
# ============================================================================
# Cài đặt:   pip install pre-commit && pre-commit install
# Chạy thủ công: pre-commit run --all-files
# ============================================================================

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^VeoSuite_V3/(config/.*\.json|database/.*\.json)$
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=no"]   # giữ nguyên line-ending hiện tại (Windows-friendly)

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
