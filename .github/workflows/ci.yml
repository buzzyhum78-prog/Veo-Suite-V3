name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    # Run CI on PRs targeting main/master AND on stacked PRs that target
    # in-progress devin/* feature branches (e.g. PR-5b1 stacks on PR-5's
    # `devin/1778252165-pr5-refactor`). Without `devin/**` here, stacked PRs
    # would not get CI signal, forcing reviewers to trust the parent PR's CI.
    branches: [main, master, "devin/**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps for PyQt6 (offscreen) + ffmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 \
            ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: py_compile smoke
        run: |
          python -m compileall -q VeoSuite_V3

      - name: Pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q
